services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dnd-tactics-backend
    ports:
      - "8000:8000"
    restart: unless-stopped

  launcher:
    build:
      context: ./launcher
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8000
    container_name: dnd-tactics-launcher
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

